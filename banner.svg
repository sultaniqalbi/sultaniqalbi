<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Void Canvas -->
    <linearGradient id="cosmicVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04020a"/>
      <stop offset="35%" stop-color="#090518"/>
      <stop offset="70%" stop-color="#12082b"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>

    <!-- Aurora Borealis Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00ffb3" stop-opacity="0.75"/>
      <stop offset="45%" stop-color="#7928ca" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#ff007f" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Liquid Chrome Metallic Gradient (Y2K / Futuristic) -->
    <linearGradient id="liquidChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#00f0ff"/>
      <stop offset="48%" stop-color="#e0e7ff"/>
      <stop offset="52%" stop-color="#1e1035"/>
      <stop offset="75%" stop-color="#ff007f"/>
      <stop offset="90%" stop-color="#00ffb3"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Claymorphism Cloud Gradient (Soft Tactile 3D Volume) -->
    <linearGradient id="clayCloudGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#3b1d6e"/>
      <stop offset="45%" stop-color="#210f40"/>
      <stop offset="85%" stop-color="#110724"/>
      <stop offset="100%" stop-color="#06020e"/>
    </linearGradient>

    <!-- Clay Inner Highlight -->
    <linearGradient id="clayRimLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ff007f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>

    <!-- Shattered Prismatic Glass Gradient (Kaca Pecah Liquid Glass) -->
    <linearGradient id="glassPrism1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#ff007f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="glassPrism2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ffb3" stop-opacity="0.4"/>
      <stop offset="40%" stop-color="#7928ca" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Bohemian Celestial Gold Foil Accent -->
    <linearGradient id="celestialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Glow & Diffusion Filters -->
    <filter id="auroraGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>

    <filter id="glassRefract" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feSpecularLighting surfaceScale="3" specularConstant="1.2" specularExponent="20" lighting-color="#ffffff" in="blur" result="spec">
        <fePointLight x="600" y="100" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="spec" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <filter id="clayShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="-4" stdDeviation="12" flood-color="#00f0ff" flood-opacity="0.25"/>
    </filter>

    <!-- Pixel Art Star Pattern -->
    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" x="0" y="0" fill="#00f0ff" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- ================= CANVAS BASE & LIQUID RETRO SUBSTRATE ================= -->
  <!-- Rounded Frame with Y2K Glassmorphism Edge -->
  <rect width="1196" height="456" x="2" y="2" rx="32" fill="url(#cosmicVoid)"/>
  <rect width="1194" height="454" x="3" y="3" rx="31" fill="none" stroke="url(#liquidChrome)" stroke-width="1.8" stroke-opacity="0.45"/>
  <rect width="1196" height="456" x="2" y="2" rx="32" fill="url(#pixelGrid)" opacity="0.8"/>

  <!-- ================= ETHEREAL AURORA CURTAINS ================= -->
  <path d="M-80,180 
           Q 220,60 550,150 
           T 1100,90 
           T 1300,160 
           L 1300,340 
           Q 950,260 620,310 
           T -80,300 Z" 
        fill="url(#auroraGrad)" 
        filter="url(#auroraGlow)" 
        opacity="0.7"/>

  <!-- Secondary Aurora Filament (Neon Mint to Magenta) -->
  <path d="M -40,110 
           C 260,200 480,40 820,120 
           C 1050,180 1180,90 1280,130 
           L 1280,260 
           C 1080,210 780,290 420,200 
           Z" 
        fill="url(#auroraGrad)" 
        filter="url(#auroraGlow)" 
        opacity="0.45"/>

  <!-- ================= CELESTIAL BOHEMIAN ORBITS & Y2K STARS ================= -->
  <g opacity="0.6">
    <!-- Fine Orbital Wireframes -->
    <circle cx="210" cy="190" r="140" fill="none" stroke="url(#celestialGold)" stroke-width="1" stroke-dasharray="3,8" opacity="0.4"/>
    <circle cx="990" cy="220" r="160" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="5,6" opacity="0.35"/>
    <ellipse cx="600" cy="210" rx="420" ry="110" fill="none" stroke="url(#liquidChrome)" stroke-width="0.8" stroke-dasharray="2,12" opacity="0.3"/>
  </g>

  <!-- Y2K 4-Point Chrome Starbursts (✦) -->
  <!-- Star Left -->
  <path d="M 170,120 Q 170,95 160,85 Q 170,75 170,50 Q 170,75 180,85 Q 170,95 170,120 Z" fill="url(#liquidChrome)"/>
  <circle cx="170" cy="85" r="3" fill="#ffffff"/>
  <!-- Star Right Top -->
  <path d="M 1030,140 Q 1030,118 1020,110 Q 1030,102 1030,80 Q 1030,102 1040,110 Q 1030,118 1030,140 Z" fill="url(#liquidChrome)"/>
  <circle cx="1030" cy="110" r="2.5" fill="#ffffff"/>
  <!-- Small Star Center -->
  <path d="M 680,80 Q 680,68 672,62 Q 680,56 680,44 Q 680,56 688,62 Q 680,68 680,80 Z" fill="#00ffb3" opacity="0.8"/>

  <!-- Pixel Art Glyphs (8-Bit Retro Sparks) -->
  <g fill="#00f0ff" opacity="0.85">
    <!-- Pixel Cluster 1 -->
    <rect x="86" y="70" width="3" height="3"/>
    <rect x="89" y="67" width="3" height="3"/>
    <rect x="92" y="70" width="3" height="3"/>
    <rect x="89" y="73" width="3" height="3"/>
    <!-- Pixel Cluster 2 -->
    <rect x="1100" y="290" width="3" height="3" fill="#ff007f"/>
    <rect x="1103" y="287" width="3" height="3" fill="#ff007f"/>
    <rect x="1106" y="290" width="3" height="3" fill="#ff007f"/>
    <rect x="1103" y="293" width="3" height="3" fill="#ff007f"/>
  </g>

  <!-- ================= CLAYMORPHIC PUFFY CLOUDS (ORGANIC 3D WARMTH) ================= -->
  <g filter="url(#clayShadow)">
    <!-- Base Layer Cloud Billows -->
    <path d="M -60,460 
             C 40,360 120,380 220,370 
             C 320,360 370,300 480,310 
             C 590,320 660,370 780,350 
             C 900,330 960,290 1070,310 
             C 1180,330 1230,370 1300,460 Z" 
          fill="url(#clayCloudGrad)"/>
    
    <!-- Clay Rim Highlight Curve -->
    <path d="M -60,460 
             C 40,360 120,380 220,370 
             C 320,360 370,300 480,310 
             C 590,320 660,370 780,350 
             C 900,330 960,290 1070,310 
             C 1180,330 1230,370 1300,460" 
          fill="none" stroke="url(#clayRimLight)" stroke-width="3.5" opacity="0.85"/>
  </g>

  <!-- Second Soft Pillowy Cloud Mound -->
  <path d="M 120,460 
           C 200,380 270,395 380,385 
           C 490,375 570,390 680,380 
           C 790,370 880,395 990,385 
           C 1060,378 1140,400 1220,460 Z" 
        fill="#180b33" opacity="0.9"/>
  <path d="M 120,460 
           C 200,380 270,395 380,385 
           C 490,375 570,390 680,380 
           C 790,370 880,395 990,385 
           C 1060,378 1140,400 1220,460" 
        fill="none" stroke="url(#auroraGrad)" stroke-width="2" opacity="0.6"/>

  <!-- ================= SHATTERED PRISMATIC GLASS SHARDS (KACA PECAH LIQUID GLASS) ================= -->
  <!-- Floating angled crystal shards with chromatic specular edge -->
  
  <!-- Shard 1 (Left Upper Giant Prism) -->
  <polygon points="90,180 185,110 240,195 145,245" 
           fill="url(#glassPrism1)" 
           stroke="url(#liquidChrome)" 
           stroke-width="1.6" 
           stroke-opacity="0.85" 
           filter="url(#glassRefract)"/>
  <line x1="90" y1="180" x2="240" y2="195" stroke="#ffffff" stroke-width="1" stroke-opacity="0.75"/>

  <!-- Shard 2 (Floating Small Shard Left) -->
  <polygon points="265,115 315,90 330,140 280,155" 
           fill="url(#glassPrism2)" 
           stroke="#00f0ff" 
           stroke-width="1.2" 
           stroke-opacity="0.7"/>

  <!-- Shard 3 (Right Shattered Shard Top) -->
  <polygon points="980,160 1090,105 1130,190 1020,225" 
           fill="url(#glassPrism1)" 
           stroke="url(#liquidChrome)" 
           stroke-width="1.5" 
           stroke-opacity="0.9" 
           filter="url(#glassRefract)"/>
  <line x1="1090" y1="105" x2="1020" y2="225" stroke="#ff007f" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Shard 4 (Right Small Crystal Spike) -->
  <polygon points="920,240 965,210 985,270 940,285" 
           fill="url(#glassPrism2)" 
           stroke="#00ffb3" 
           stroke-width="1.2" 
           stroke-opacity="0.65"/>

  <!-- Shard 5 & 6 (Center Micro Flying Glass Splinters) -->
  <polygon points="560,95 590,75 580,110" fill="#ffffff" opacity="0.6" stroke="#00f0ff" stroke-width="0.8"/>
  <polygon points="630,90 655,105 625,115" fill="url(#glassPrism1)" stroke="#ff007f" stroke-width="0.8"/>
  <polygon points="460,260 495,240 510,280 475,290" fill="url(#glassPrism2)" stroke="#ffffff" stroke-width="1" opacity="0.7"/>
  <polygon points="720,255 770,230 755,285 710,270" fill="url(#glassPrism1)" stroke="url(#liquidChrome)" stroke-width="1" opacity="0.75"/>

  <!-- ================= SWISS EDITORIAL & MODERN GROTESK TYPOGRAPHY ================= -->
  
  <!-- Swiss Editorial Archive Header -->
  <g transform="translate(600, 72)">
    <!-- Frosted Pill Container -->
    <rect x="-170" y="-14" width="340" height="28" rx="14" fill="#0d0722" fill-opacity="0.8" stroke="url(#liquidChrome)" stroke-width="1" stroke-opacity="0.6"/>
    <!-- Small Emerald Status Node -->
    <circle cx="-146" cy="0" r="3.5" fill="#00ffb3"/>
    <text x="6" y="4.5" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="10.5" 
          font-weight="800" 
          letter-spacing="3" 
          fill="#cbd5e1" 
          text-anchor="middle">
      GIBEI TELKOM UNIV // ARCHIVE 25-26
    </text>
  </g>

  <!-- Graffiti / Handwritten Art Accent (Behind / Above Name) -->
  <path d="M 370,165 
           Q 460,115 600,120 
           T 830,115" 
        fill="none" 
        stroke="url(#celestialGold)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        opacity="0.5" 
        stroke-dasharray="16,6,4,6"/>
  
  <!-- Expressive Script Slogan -->
  <text x="600" y="118" 
        font-family="'Brush Script MT', 'Segoe Script', 'Great Vibes', cursive" 
        font-size="16" 
        fill="#fef08a" 
        opacity="0.8" 
        text-anchor="middle" 
        letter-spacing="1">
    raw engineering ~ financial precision
  </text>

  <!-- ================= HERO NAME: SULTANI QALBI ================= -->
  <!-- Ambient Glow Behind Name -->
  <text x="600" y="196" 
        font-family="'Helvetica Neue', 'Arial Black', -apple-system, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="7" 
        fill="#00f0ff" 
        text-anchor="middle" 
        opacity="0.35" 
        filter="url(#auroraGlow)">
    SULTANI QALBI
  </text>

  <!-- Prismatic Liquid Chrome Name Text -->
  <text x="600" y="196" 
        font-family="'Helvetica Neue', 'Arial Black', -apple-system, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="7" 
        fill="url(#liquidChrome)" 
        text-anchor="middle" 
        stroke="#ffffff" 
        stroke-width="0.8">
    SULTANI QALBI
  </text>

  <!-- Swiss Editorial Disciplines Row -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" 
          font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" 
          font-size="13" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="#f1f5f9" 
          text-anchor="middle">
      FULL-STACK WEB  <tspan fill="#ff007f">✦</tspan>  IoT &amp; HARDWARE  <tspan fill="#00ffb3">✦</tspan>  EQUITY ANALYST @ GIBEI
    </text>
  </g>

  <!-- Editorial Sub-Grid Tagline -->
  <g transform="translate(600, 272)">
    <line x1="-180" y1="0" x2="180" y2="0" stroke="url(#liquidChrome)" stroke-width="1.2" opacity="0.6"/>
    <rect x="-6" y="-3" width="12" height="6" fill="#00f0ff"/>
  </g>

  <!-- Liquid Glass Prismatic Badges (Swiss Matrix Bottom) -->
  <g transform="translate(600, 316)">
    <!-- Pill 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-85" y="-12" width="170" height="25" rx="12.5" fill="#13082a" fill-opacity="0.75" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="4.5" font-family="'Helvetica Neue', sans-serif" font-size="9.5" font-weight="800" letter-spacing="2" fill="#00f0ff" text-anchor="middle">
        WEB // SEMPOA SIP
      </text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-95" y="-12" width="190" height="25" rx="12.5" fill="#13082a" fill-opacity="0.75" stroke="#ff007f" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="4.5" font-family="'Helvetica Neue', sans-serif" font-size="9.5" font-weight="800" letter-spacing="2" fill="#ff007f" text-anchor="middle">
        HARDWARE // ESP32 RFID
      </text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(240, 0)">
      <rect x="-85" y="-12" width="170" height="25" rx="12.5" fill="#13082a" fill-opacity="0.75" stroke="#00ffb3" stroke-width="1" stroke-opacity="0.6"/>
      <text x="0" y="4.5" font-family="'Helvetica Neue', sans-serif" font-size="9.5" font-weight="800" letter-spacing="2" fill="#00ffb3" text-anchor="middle">
        FINANCE // GIBEI 25-26
      </text>
    </g>
  </g>

</svg>
