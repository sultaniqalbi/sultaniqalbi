<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 22" width="100%" height="22">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00ffb3" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ff007f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>

  <!-- Main Horizontal Line -->
  <line x1="40" y1="11" x2="860" y2="11" stroke="url(#lineGrad)" stroke-width="1.2"/>

  <!-- Circuit Board Nodes along the line -->
  <!-- Left cluster -->
  <rect x="60" y="8" width="6" height="6" rx="1" fill="#00ffb3" opacity="0.9"/>
  <rect x="75" y="7" width="8" height="8" rx="1.5" fill="none" stroke="#00f0ff" stroke-width="1"/>
  <rect x="93" y="9" width="4" height="4" rx="0.8" fill="#7928ca"/>

  <!-- Left-center: vertical tick -->
  <line x1="200" y1="5" x2="200" y2="17" stroke="#00f0ff" stroke-width="1.5" opacity="0.7"/>
  <circle cx="200" cy="11" r="3" fill="none" stroke="#00f0ff" stroke-width="1.2"/>

  <!-- Center diamond -->
  <polygon points="450,5 456,11 450,17 444,11" fill="url(#nodeGrad)" opacity="0.95"/>
  <polygon points="450,7 454,11 450,15 446,11" fill="#ffffff" opacity="0.6"/>

  <!-- Right-center: vertical tick -->
  <line x1="700" y1="5" x2="700" y2="17" stroke="#ff007f" stroke-width="1.5" opacity="0.7"/>
  <circle cx="700" cy="11" r="3" fill="none" stroke="#ff007f" stroke-width="1.2"/>

  <!-- Right cluster -->
  <rect x="803" y="9" width="4" height="4" rx="0.8" fill="#7928ca"/>
  <rect x="817" y="7" width="8" height="8" rx="1.5" fill="none" stroke="#ff007f" stroke-width="1"/>
  <rect x="834" y="8" width="6" height="6" rx="1" fill="#ff007f" opacity="0.9"/>
</svg>
